<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆借阅数据看板</title>
  <!-- Bootstrap5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1>图书馆借阅统计</h1>
    <p id="source">数据来源：课程统一数据集</p>
  </header>

  <div id="status" class="alert alert-warning"></div>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="mb-5">
    <h3>各月借阅量（ECharts柱状图）</h3>
    <div id="barChart" class="chart-box border"></div>
  </section>

  <section>
    <h3>借阅趋势（Chart.js折线图）</h3>
    <div class="chart-box border">
      <canvas id="lineChart"></canvas>
    </div>
  </section>

  <!-- 在线CDN脚本顺序不能乱 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
