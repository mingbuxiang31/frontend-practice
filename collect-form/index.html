<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,height=initial-scale=1.0">
        <link rel="stylesheet" type="css" href="style.css">
        <title>吸烟问卷调查</title>
    </head>
    <body>
        <header>
            <h1>吸烟问卷调查</h1>
            </header>
            <nav>
                <a href="#intro">填写说明</a>
                <a href="#form">填写表单</a>
            </nav>
        <main>
            <section id="intro">
                <h2>填写说明</h2>
                <p>匿名收集，仅用于社会调查</p>
            </section>
            <section id="form">
                <h2>反馈表单</h2>
            </section>


        </main>
        <footer>
            <p>自主选题</p>
        </footer>
    </body>
    <table border="1">
        <thead>
            <tr><th>项目</th>
                <th>数量</th>
                </tr>
           
        </thead>
        <tbody>
            <tr><td>已收集</td>
            <td>90</td>
            </tr>
            <tr><td>应收集</td><td>100</td></tr>
            
        </tbody>
    </table>
    <br>
    <form action="#" method="get">
        <p>是否吸烟</p>
        <label>
            <input type="radio" name="boolean" value="yes" required>yes
        </label>
        <label><input type="radio" name="boolean" value="no" required>no</label>
        <label>
            <p>
        吸烟频率（如不抽，可跳过）
        </p>
        <select name="frequence">
            <option value="">请选择</option>
            <option value="1">一天三次</option>
            <option value="2">三天三次</option>
        </select>
        </label>
        <p>个人信息采集</p>
<label>
    用户名
    <input type="text" name="name" required max="10">
</label>
<br>
<label>邮箱
    <input type="email" name="mail" required maxlength="20">
</label>
<br>
<label>生日
    <input type="date" name="date">
</label>
<br>
<label>
    对本次调研的建议
    <textarea name="advice" rows="3" maxlength="200" placeholder="留下宝贵的建议"></textarea>
</label>
<p></p>
<button type="submit">提交</button>
<p></p>
<button type="reset">重置</button>
    </form>
</html>
